[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satisgraph"
version = "0.1.0"
description = "A lightweight data pipeline for Satisfactory game data analysis using Neo4j"
readme = "README.md"
authors = [{name = "Nazano", email = "nazano@example.com"}]
license = {text = "MIT"}
dependencies = [
    "neo4j>=5.0.0",
    "requests>=2.28.0",
    "click>=8.0.0",
    "pydantic>=1.10.0",
    "pyyaml>=6.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
satisgraph = "satisgraph.cli:main"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true